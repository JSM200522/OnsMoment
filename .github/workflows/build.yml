name: Build Ons Moment APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.19
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Genereer Android platform folder
        run: |
          mkdir -p /tmp/flutter_template
          cd /tmp/flutter_template
          flutter create --platforms=android --org=com.onsmoment --project-name=ons_moment .
          cp -r android $GITHUB_WORKSPACE/android

      - name: Fix applicationId naar com.onsmoment.app
        run: |
          sed -i 's|applicationId = "com.onsmoment.ons_moment"|applicationId = "com.onsmoment.app"|g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|applicationId "com.onsmoment.ons_moment"|applicationId "com.onsmoment.app"|g' android/app/build.gradle 2>/dev/null || true

      - name: Verhoog minSdkVersion naar 23
        run: |
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 23|g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|minSdkVersion flutter.minSdkVersion|minSdkVersion 23|g' android/app/build.gradle 2>/dev/null || true
          sed -i 's|minSdk flutter.minSdkVersion|minSdk 23|g' android/app/build.gradle 2>/dev/null || true

      - name: Registreer google-services plugin in settings.gradle.kts
        run: |
          if [ -f android/settings.gradle.kts ]; then
            python3 << 'EOF'
          with open('android/settings.gradle.kts', 'r') as f:
              content = f.read()
          import re
          pattern = r'(id\("com\.android\.application"\)\s+version\s+"[^"]+"\s+apply\s+false)'
          if 'com.google.gms.google-services' not in content:
              content = re.sub(pattern, r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false', content)
          with open('android/settings.gradle.kts', 'w') as f:
              f.write(content)
          EOF
          fi

      - name: Registreer google-services plugin in settings.gradle (Groovy)
        run: |
          if [ -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            python3 << 'EOF'
          with open('android/settings.gradle', 'r') as f:
              content = f.read()
          import re
          pattern = r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"][^'\"]+['\"]\s+apply\s+false)"
          if 'com.google.gms.google-services' not in content:
              content = re.sub(pattern, r"\1\n    id 'com.google.gms.google-services' version '4.4.2' apply false", content)
          with open('android/settings.gradle', 'w') as f:
              f.write(content)
          EOF
          fi

      - name: Pas google-services plugin toe in app/build.gradle.kts
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            python3 << 'EOF'
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          if 'com.google.gms.google-services' not in content:
              content = content.replace(
                  'id("com.android.application")',
                  'id("com.android.application")\n    id("com.google.gms.google-services")',
                  1
              )
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          EOF
          fi

      - name: Pas google-services plugin toe in app/build.gradle (Groovy)
        run: |
          if [ -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            if ! grep -q "google-services" android/app/build.gradle; then
              echo "" >> android/app/build.gradle
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
          fi

      - name: Plaats google-services.json
        run: |
          cp google-services.json android/app/google-services.json
          ls -la android/app/google-services.json

      - name: Voeg permissions toe aan AndroidManifest
        run: |
          python3 << 'EOF'
          import re
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
          '''
          content = re.sub(r'(<manifest[^>]*>)', r'\1' + permissions, content)
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          EOF

      - name: Fix wakelock_plus import in tablet_scherm
        run: |
          python3 << 'EOF'
          with open('lib/screens/tablet/tablet_scherm.dart', 'r') as f:
              content = f.read()
          if "import 'package:wakelock_plus/wakelock_plus.dart'" not in content:
              lines = content.split('\n')
              last_import_idx = 0
              for i, line in enumerate(lines):
                  if line.startswith('import '):
                      last_import_idx = i
              lines.insert(last_import_idx + 1, "import 'package:wakelock_plus/wakelock_plus.dart';")
              content = '\n'.join(lines)
              with open('lib/screens/tablet/tablet_scherm.dart', 'w') as f:
                  f.write(content)
              print("Import toegevoegd aan tablet_scherm.dart")
          else:
              print("Import bestond al")
          EOF
          head -20 lib/screens/tablet/tablet_scherm.dart

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Toon APK info
        run: |
          ls -la build/app/outputs/flutter-apk/
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK als artifact
        uses: actions/upload-artifact@v4
        with:
          name: ons-moment-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
