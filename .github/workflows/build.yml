name: Build Ons Moment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter 3.19
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Genereer web platform folder
        run: |
          mkdir -p /tmp/flutter_template
          cd /tmp/flutter_template
          flutter create --platforms=web --org=com.onsmoment --project-name=ons_moment .
          cp -r web $GITHUB_WORKSPACE/web

      - name: Fix wakelock import
        run: |
          python3 << 'EOF'
          with open('lib/screens/tablet/tablet_scherm.dart', 'r') as f:
              content = f.read()
          if "import 'package:wakelock_plus/wakelock_plus.dart'" not in content:
              lines = content.split('\n')
              last_import_idx = 0
              for i, line in enumerate(lines):
                  if line.startswith('import '):
                      last_import_idx = i
              lines.insert(last_import_idx + 1, "import 'package:wakelock_plus/wakelock_plus.dart';")
              content = '\n'.join(lines)
              with open('lib/screens/tablet/tablet_scherm.dart', 'w') as f:
                  f.write(content)
          EOF

      - name: Genereer firebase_options.dart
        run: |
          python3 << 'EOF'
          import json
          with open('google-services.json', 'r') as f:
              config = json.load(f)
          client = config['client'][0]
          project_id = config['project_info']['project_id']
          api_key = client['api_key'][0]['current_key']
          app_id = client['client_info']['mobilesdk_app_id']
          messaging_sender_id = config['project_info']['project_number']
          storage_bucket = config['project_info']['storage_bucket']

          firebase_options = f'''// Automatisch gegenereerd
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform {{
              if (kIsWeb) {{
                return web;
              }}
              switch (defaultTargetPlatform) {{
                case TargetPlatform.android:
                  return android;
                default:
                  return web;
              }}
            }}

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '{api_key}',
              appId: '{app_id}',
              messagingSenderId: '{messaging_sender_id}',
              projectId: '{project_id}',
              authDomain: '{project_id}.firebaseapp.com',
              storageBucket: '{storage_bucket}',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '{api_key}',
              appId: '{app_id}',
              messagingSenderId: '{messaging_sender_id}',
              projectId: '{project_id}',
              storageBucket: '{storage_bucket}',
            );
          }}
          '''
          with open('lib/firebase_options.dart', 'w') as f:
              f.write(firebase_options)
          print("firebase_options.dart aangemaakt")
          EOF

      - name: Update main.dart om firebase_options te gebruiken
        run: |
          python3 << 'EOF'
          with open('lib/main.dart', 'r') as f:
              content = f.read()
          if 'firebase_options.dart' not in content:
              content = content.replace(
                  "import 'package:firebase_core/firebase_core.dart';",
                  "import 'package:firebase_core/firebase_core.dart';\nimport 'firebase_options.dart';"
              )
              content = content.replace(
                  'await Firebase.initializeApp();',
                  'await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);'
              )
              with open('lib/main.dart', 'w') as f:
                  f.write(content)
              print("main.dart geupdate")
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --base-href "/OnsMoment/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy_web:
    needs: build_web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
