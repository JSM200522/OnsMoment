plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// V9 release signing: lokale fallback via android/key.properties (gitignored).
// Op Codemagic worden de CM_*-env-vars gebruikt — zie signingConfigs.release.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "nl.onsmoment.app"
    // Play Store-eis: targetSdk 36 (Android 16) verplicht per 31 aug 2026.
    // compileSdk op 35 gehouden: AGP 8.6.0 + Gradle 8.7 schrijven de
    // targetSdk in het manifest zonder SDK-36-platform nodig te hebben.
    // compileSdk ophogen naar 36 pas als Codemagic SDK 36 beschikbaar heeft.
    compileSdk 35
    // Vast gepind: enkele plugins (o.a. wakelock_plus) eisen een hogere NDK
    // dan flutter.ndkVersion op de huidige Flutter-SDK levert. Codemagic
    // waarschuwde hierover — hardcoden voorkomt drift tussen build-machines.
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Vereist door flutter_local_notifications 17.x (Fase 2 push-meldingen)
        // — die gebruikt java.time-APIs die op minSdk 23 alleen via desugaring
        // beschikbaar zijn. Zonder deze regel faalt :app:checkReleaseAarMetadata.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "nl.onsmoment.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // V9 release signing: dual-mode. Op Codemagic (CI=true) lezen we de
    // door Codemagic geïnjecteerde keystore-env-vars; lokaal vallen we
    // terug op android/key.properties (gitignored). Voorkomt dat de
    // release-AAB wordt ondertekend met de gedeelde Android-debug-key,
    // die door Google Play wordt geweigerd.
    signingConfigs {
        release {
            if (System.getenv()["CI"]) {
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            } else {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile']
                    ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Runtime-backport van java.time e.d. voor minSdk 23. Vereist door
    // flutter_local_notifications 17.x. Versie 2.1.4 past bij AGP 8.6.0
    // (min. 2.0.4 vereist door de plugin).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

apply plugin: 'com.google.gms.google-services'
// Fase 3d-C4: Crashlytics Gradle-plugin. Moet ná google-services staan,
// anders vindt hij het Firebase-project niet.
apply plugin: 'com.google.firebase.crashlytics'
