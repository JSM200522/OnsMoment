pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // FASE D-1 (13 sept 2026): AGP 8.6.0 → 8.11.1. Vereist door Flutter
    // 3.47.4 (minimum Gradle 8.14) — AGP 8.11 is de eerste die met Gradle
    // 8.13+ werkt. AGP 9+ vermeden: die vereist een DSL-herschrijving
    // die de Flutter Gradle plugin nog niet ondersteunt (waarschuwing
    // uit Codemagic-build-fail: "Starting AGP 9+, only the new DSL
    // interface will be read. This results in a build failure...").
    id "com.android.application" version "8.11.1" apply false
    // Kotlin 1.9.22 → 2.0.21. AGP 8.11 vereist Kotlin 2.0+.
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

include ":app"
