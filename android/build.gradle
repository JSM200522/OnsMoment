buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.0'
        // Crashlytics Gradle-plugin (Fase 3d-C4): uploadt automatisch de
        // mapping/symbol-files bij elke release-build zodat stack-traces in
        // de Firebase Console leesbaar zijn i.p.v. obfuscated. Vereist door
        // firebase_crashlytics — zonder deze plugin faalt de Android-build.
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// AGP 8+ vereist dat elke library-module een namespace heeft. Oude Flutter-
// plugins (zoals record_android 1.2.0) declareren alleen package="..." in
// hun AndroidManifest.xml en hebben geen namespace in build.gradle. Onder
// AGP 8 faalt zo'n module met "Namespace not specified". Onderstaand block
// detecteert die plugins en injecteert de package-naam als namespace.
//
// Veilig: raakt alleen modules die de Android-library/application plugin
// hebben EN waarvan namespace null is. Modules die zelf al een namespace
// hebben (alle moderne plugins) worden niet aangeraakt.
//
// MOET vóór `subprojects { evaluationDependsOn(':app') }` staan: anders is
// :app al geëvalueerd tegen de tijd dat onze afterEvaluate-hook geregistreerd
// wordt → Gradle gooit "Cannot run Project.afterEvaluate when the project
// is already evaluated."
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")
            || project.plugins.hasPlugin("com.android.application")) {
            project.android {
                if (namespace == null) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestXml = new XmlSlurper().parse(manifestFile)
                        namespace = manifestXml.@package.text()
                    }
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
