name: ons_moment
description: Ons Moment - Verbinding voor mensen met dementie
publish_to: 'none'
version: 1.0.67+78

environment:
  # FASE D-1 (12 sept 2026): Dart 3.4 / Flutter 3.22 vereist voor
  # purchases_flutter ^9.x (die Billing Library 8 meebrengt vóór de
  # deadline van 1 nov 2026). Zie CLAUDE.md "⚠️ DEADLINE — vóór
  # 1 nov 2026". Route D wordt in deze branch omgekeerd.
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # FASE D-1 (13 sept 2026): Firebase-generation na core 3.0 (mei 2024).
  # Alle brothers zijn tegelijk gebumpt naar de eerste major die met
  # core 3.x meekwam — Firebase-packages MOETEN dezelfde generatie
  # gebruiken want ze delen platform-interfaces.
  # Als resolver hierbij klaagt over hogere ranges, kunnen we naar
  # ^4.x/^5.x-generation. Deze eerste poging gebruikt ruime ^-ranges
  # zodat pub de nieuwste 3.x-compat versies kiest.
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  flutter_local_notifications: ^17.1.2
  just_audio: ^0.9.36
  # BEL-E5: expliciete dep zodat we AndroidAudioAttributes kunnen zetten
  # op de ringback/marimba-spelers. Al transitief via just_audio, maar
  # direct declareren voorkomt implicit-open-dependency-lint en pint de
  # major-versie voor onze audio-attribuut-code.
  audio_session: ^0.1.21
  # FASE D-1 (13 sept 2026): record 5.1 → 6.x. record_linux 0.7.2 was
  # te oud voor record_platform_interface 1.6.0 dat via de flutter pub
  # upgrade werd binnengetrokken. Bump forceert de complete record-familie
  # (record_android/darwin/linux/web/windows) naar consistent nieuwere
  # versies. AudioRecorder-class-API is stabiel gebleven sinds record 5.0.
  record: ^6.0.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  wakelock_plus: ^1.2.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  http: ^1.2.0
  device_info_plus: ^10.1.0
  video_player: 2.9.2
  url_launcher: ^6.2.5
  livekit_client: ^2.2.4
  # Fase VB-V1: HTTPS-callable naar getVideoCallToken (europe-west1).
  cloud_functions: ^5.0.0
  # Fase VB-V1: runtime-permissie voor camera bij eerste bel. Android-first
  # (iOS-integratie zit in de package; web is no-op — geen call daar dankzij
  # kIsWeb-guard in VideoCallService).
  permission_handler: ^11.3.1
  # Optie B — ConnectionService/TelecomManager (Android) + CallKit (iOS).
  # B1: alleen toegevoegd als dependency; nog geen code-gebruik. Bij B2
  # volgt manifest-config + PhoneAccount-registratie.
  flutter_callkit_incoming: ^2.5.0
  # FDB-1 (11 sept 2026): dynamische app-versie voor feedback-doc. Zonder
  # dit moet _appVersie handmatig meebumpen bij elke release; met dit
  # leest de app 'm uit de gemergde manifest. Compatibel met Dart 3.3.4.
  package_info_plus: ^8.0.2
  # FASE D-1 (12 sept 2026): purchases_flutter TERUG na Flutter-upgrade.
  # 9.x brengt Play Billing Library 8 mee (dekt de 1 nov 2026-deadline)
  # + de com.android.vending.BILLING-permissie in de merged manifest,
  # waardoor Play Console het aanmaken van abonnementen weer toestaat.
  # Route D (commit 906f501) wordt in deze feature-branch omgekeerd.
  purchases_flutter: ^9.0.0
  # FASE D-1 P3 (13 sept 2026): per-OEM deep-links naar de exacte
  # autostart-instellingpagina (Samsung/Xiaomi/Huawei/Oppo/Vivo/Realme).
  # StroomuitvalService.openOemAutostartInstellingen probeert eerst een
  # merk-specifieke Intent en valt terug op app-info-settings als de
  # deep-link niet meer werkt op deze OS-versie.
  android_intent_plus: ^5.0.0

dependency_overrides:
  # FASE D-1 (13 sept 2026): record_android 1.2.0-override VERWIJDERD.
  # Was uit Flutter 3.19.6-tijdperk om een specifieke oude versie
  # (zie CLAUDE.md reference-flutter-versie-stack) te forceren. Nu we
  # op Flutter 3.47.4 + record ^6.0.0 zitten, is 1.2.0 zelf te oud
  # (record_platform_interface 1.6.0-signature-mismatch met record_linux
  # + waarschijnlijk ook Android). Pub-resolver kiest nu de bij record 6.x
  # horende record_android 2.x zonder override.
  # FASE D-1 (13 sept 2026): win32 5.5.0 gebruikt UnmodifiableUint8ListView
  # die in Dart 3.13 uit dart:typed_data is verwijderd → Codemagic-build
  # fail 3. win32 5.14+ heeft de fix. Override omdat win32 een transitieve
  # dep is (via path_provider_windows, shared_preferences_windows) — een
  # gewone dependencies-declaratie zou hem niet forceren.
  # Windows-only package; wij zijn Android-first, maar de tree moet
  # resolven anders faalt de compile.
  win32: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: false
  adaptive_icon_background: "#FDF4E8"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23
