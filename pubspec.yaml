name: ons_moment
description: Ons Moment - Verbinding voor mensen met dementie
publish_to: 'none'
version: 1.0.48+59

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.20
  firebase_crashlytics: ^3.5.0
  flutter_local_notifications: ^17.1.2
  just_audio: ^0.9.36
  # BEL-E5: expliciete dep zodat we AndroidAudioAttributes kunnen zetten
  # op de ringback/marimba-spelers. Al transitief via just_audio, maar
  # direct declareren voorkomt implicit-open-dependency-lint en pint de
  # major-versie voor onze audio-attribuut-code.
  audio_session: ^0.1.21
  record: ^5.1.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  wakelock_plus: ^1.2.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  http: ^1.2.0
  device_info_plus: ^10.1.0
  video_player: 2.9.2
  url_launcher: ^6.2.5
  livekit_client: ^2.2.4
  # Fase VB-V1: HTTPS-callable naar getVideoCallToken (europe-west1).
  cloud_functions: ^4.6.9
  # Fase VB-V1: runtime-permissie voor camera bij eerste bel. Android-first
  # (iOS-integratie zit in de package; web is no-op — geen call daar dankzij
  # kIsWeb-guard in VideoCallService).
  permission_handler: ^11.3.1
  # Optie B — ConnectionService/TelecomManager (Android) + CallKit (iOS).
  # B1: alleen toegevoegd als dependency; nog geen code-gebruik. Bij B2
  # volgt manifest-config + PhoneAccount-registratie.
  flutter_callkit_incoming: ^2.5.0
  # FDB-1 (11 sept 2026): dynamische app-versie voor feedback-doc. Zonder
  # dit moet _appVersie handmatig meebumpen bij elke release; met dit
  # leest de app 'm uit de gemergde manifest. Compatibel met Dart 3.3.4.
  package_info_plus: ^8.0.2
  # Route D (11 sept 2026): purchases_flutter TIJDELIJK verwijderd omdat
  # 8.11.0 Play Billing Library 7.1.1 meebrengt, en Play Console sinds
  # 1 sept 2026 uploads met Billing 7.x weigert. purchases_flutter 9.x
  # (met Billing 8) vereist Flutter 3.22 / Dart 3.4 (breaking bump).
  # Terugzetten bij FASE D-2 gebundeld met de Flutter-upgrade, vóór
  # 1 nov 2026. Zie CLAUDE.md "⚠️ DEADLINE — vóór 1 nov 2026".
  # purchases_flutter: 8.11.0

dependency_overrides:
  record_android: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: false
  adaptive_icon_background: "#FDF4E8"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23
