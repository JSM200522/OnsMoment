name: ons_moment
description: Ons Moment - Verbinding voor mensen met dementie
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  just_audio: ^0.9.36
  record: ^5.1.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  wakelock_plus: ^1.2.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  http: ^1.2.0
  device_info_plus: ^10.1.0
  video_player: 2.9.2

dependency_overrides:
  record_android: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: false
  adaptive_icon_background: "#FDF4E8"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23
